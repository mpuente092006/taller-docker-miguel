services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: prestamos
      POSTGRES_PASSWORD: prestamos
      POSTGRES_DB: prestamos
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prestamos -d prestamos"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "9000:9000"
    environment:
      PRESTAMOS_DB_URL: postgresql+psycopg://prestamos:prestamos@db:5432/prestamos
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: